name: Reference benchmark

# Regenerate the reference benchmark — two policies on the bundled
# smoke and field-conditions suites, plus the `gauntlet compare` /
# `gauntlet diff` delta between them. Every run uploads it as a workflow artefact; on a
# release tag it is also attached to that tag's GitHub Release as
# ``reference-benchmark.zip`` so an evaluator can open a real
# ``report.html`` before installing anything.

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_reference_benchmark.py"
      - "examples/suites/tabletop-smoke.yaml"
      - "examples/suites/tabletop-field-conditions.yaml"
      - "src/gauntlet/**"
      - ".github/workflows/benchmark.yml"
    # Release tags: the zip is attached to the GitHub Release that
    # release.yml creates for the same tag.
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: reference-benchmark
  cancel-in-progress: false

permissions:
  contents: write  # attach the zip to the release

jobs:
  build:
    name: Generate benchmark artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Generate reference benchmark
        run: |
          set -eu
          uv run python scripts/generate_reference_benchmark.py \
            --out benchmarks/smoke --clean
          uv run python scripts/generate_reference_benchmark.py \
            --suite examples/suites/tabletop-field-conditions.yaml \
            --out benchmarks/field-conditions --clean

      - name: Upload benchmark artefact (for the run page)
        uses: actions/upload-artifact@v4
        with:
          name: reference-benchmark
          path: benchmarks/
          retention-days: 30

      - name: Attach benchmark to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          (cd benchmarks && zip -qr ../reference-benchmark.zip .)
          # release.yml creates the release after publishing to PyPI;
          # wait for it rather than racing it.
          for _ in $(seq 1 60); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$TAG" reference-benchmark.zip --clobber
