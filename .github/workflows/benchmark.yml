name: Reference benchmark

# Regenerate the public reference benchmark — two policies on the
# bundled smoke suite, plus the `gauntlet compare` / `gauntlet diff`
# delta between them — and publish it to GitHub Pages so an external
# evaluator can see a real `report.html` before installing anything.
#
# Hosted at: https://gauntlet-eval.github.io/gauntlet/
#
# Setup (one-time, in repo settings → Pages):
#   Source: GitHub Actions

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_reference_benchmark.py"
      - "examples/suites/tabletop-smoke.yaml"
      - "src/gauntlet/**"
      - ".github/workflows/benchmark.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Generate benchmark artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Generate reference benchmark
        run: uv run python scripts/generate_reference_benchmark.py --clean

      - name: Compose Pages site root
        run: |
          set -eu
          mkdir -p pages/v0.2.0
          cp -r benchmarks/v0.2.0/. pages/v0.2.0/
          VERSION=$(uv run python -c "import gauntlet;print(gauntlet.__version__)")
          cat > pages/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>Gauntlet — reference benchmarks</title>
            <style>
              body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #111; }
              a { color: #0b65c2; }
              .lede { color: #555; }
              code { background: #f3f3f3; padding: 0.1rem 0.3rem; border-radius: 3px; }
            </style>
          </head>
          <body>
            <h1>Gauntlet — reference benchmarks</h1>
            <p class="lede">Public benchmark artefacts regenerated on every release. Each version page links to its baseline / regressed reports + the structured delta.</p>
            <ul>
              <li><a href="./v${VERSION}/">v${VERSION}</a> &mdash; current</li>
            </ul>
            <p><a href="https://github.com/gauntlet-eval/gauntlet">Source on GitHub</a></p>
          </body>
          </html>
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Upload benchmark artefact (for the run page)
        uses: actions/upload-artifact@v4
        with:
          name: reference-benchmark
          path: benchmarks/
          retention-days: 30

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
